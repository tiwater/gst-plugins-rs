[package]
name = "gst-plugin-ticos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GStreamer plugins to interact with TICOS cloud"
repository = "https://github.com/tiwater/ticos-agent"

[dependencies]
gst.workspace = true
gst-base.workspace = true
gst-audio.workspace = true
gst-sys.workspace = true
nnstreamer-rs.workspace = true
similari = { package = "similari-trackers-rs", version = "0.26", default-features = false }
bincode = "1"
# 基础依赖
futures = "0.3"
lazy_static = "1.4"
once_cell = "1.19"
url = "2.5"
atomic_refcell = "0.1"
http = "1.0"

# 根据平台配置不同的 tokio 依赖
#[target.'cfg(not(target_os = "android"))'.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21",  features = ["connect", "native-tls"] }

#[target.'cfg(target_os = "android")'.dependencies]
#tokio = { version = "1", features = ["rt", "net", "time"] }
#tokio-tungstenite = { version = "0.21",  features = ["connect", "native-tls"] }

[lib]
name = "gstticos"
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[features]
static = []
capi = []

[build-dependencies]
gst-plugin-version-helper.workspace = true

[package.metadata.capi]
min_version = "0.8.0"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
